version: 2

models:
  - name: dim_customers
    description: "Customer dimension table with order aggregation"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: fct_orders
    description: "Order fact table containing order details and total payment amounts"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id