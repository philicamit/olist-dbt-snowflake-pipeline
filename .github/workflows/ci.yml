name: dbt CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  dbt-run-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake

      - name: Setup dbt profiles.yml
        run: |
          mkdir -p $HOME/.dbt
          echo "olist_dbt:" > $HOME/.dbt/profiles.yml
          echo "  outputs:" >> $HOME/.dbt/profiles.yml
          echo "    dev:" >> $HOME/.dbt/profiles.yml
          echo "      type: snowflake" >> $HOME/.dbt/profiles.yml
          echo "      account: \({{ secrets.SNOWFLAKE_ACCOUNT }}" >>\)HOME/.dbt/profiles.yml
          echo "      user: \({{ secrets.SNOWFLAKE_USER }}" >>\)HOME/.dbt/profiles.yml
          echo "      password: \({{ secrets.SNOWFLAKE_PASSWORD }}" >>\)HOME/.dbt/profiles.yml
          echo "      role: \({{ secrets.SNOWFLAKE_ROLE }}" >>\)HOME/.dbt/profiles.yml
          echo "      warehouse: \({{ secrets.SNOWFLAKE_WAREHOUSE }}" >>\)HOME/.dbt/profiles.yml
          echo "      database: OLIST_DB" >> $HOME/.dbt/profiles.yml
          echo "      schema: DEV" >> $HOME/.dbt/profiles.yml
          echo "      threads: 4" >> $HOME/.dbt/profiles.yml
          echo "  target: dev" >> $HOME/.dbt/profiles.yml

      - name: Run dbt Test & Build
        run: |
          dbt debug
          dbt run
          dbt test